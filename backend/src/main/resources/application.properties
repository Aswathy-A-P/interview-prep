spring.application.name=interview-prep
server.port=8080

# File-based H2 database so data survives server restarts
spring.datasource.url=jdbc:h2:file:./data/interview-prep;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Allowed origins for the React dev server (CORS)
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
